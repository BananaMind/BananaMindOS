set timeout=8
set default=4
set menu_color_normal=yellow/black
set menu_color_highlight=black/yellow

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

menuentry "BananaMind Nano Base - 2-bit (6 MB)" {
    multiboot /boot/kernel.elf precision=2
    module /boot/model-q2.bm
    boot
}

menuentry "BananaMind Nano Base - 4-bit (8 MB)" {
    multiboot /boot/kernel.elf precision=4
    module /boot/model-q4.bm
    boot
}

menuentry "BananaMind Nano Base - 8-bit (14 MB)" {
    multiboot /boot/kernel.elf precision=8
    module /boot/model-q8.bm
    boot
}

menuentry "BananaMind Nano Chat - 2-bit (6 MB)" {
    multiboot /boot/kernel.elf precision=2 chat=1
    module /boot/chat-q2.bm chat
    boot
}

menuentry "BananaMind Nano Chat - 4-bit (8 MB)" {
    multiboot /boot/kernel.elf precision=4 chat=1
    module /boot/chat-q4.bm chat
    boot
}

menuentry "BananaMind Nano Chat - 8-bit (14 MB)" {
    multiboot /boot/kernel.elf precision=8 chat=1
    module /boot/chat-q8.bm chat
    boot
}

menuentry "BananaMind 2 Micro - 4-bit (4 MB, VERY LOW QUALITY)" {
    multiboot /boot/kernel.elf precision=4 model=micro2
    module /boot/micro2-q4.bm micro2
    boot
}

menuentry "BananaMind 2 Micro - 8-bit (5 MB)" {
    multiboot /boot/kernel.elf precision=8 model=micro2
    module /boot/micro2-q8.bm micro2
    boot
}

menuentry "BananaMind 2 Micro - FP16 (8 MB)" {
    multiboot /boot/kernel.elf precision=16 model=micro2
    module /boot/micro2-f16.bm micro2
    boot
}

menuentry "MicroBananaMind v1 - FP16 (4 MB)" {
    multiboot /boot/kernel.elf precision=16 model=microv1
    module /boot/microv1-f16.bm microv1
    boot
}

menuentry "MicroBananaMind v1 - FP32 (6 MB)" {
    multiboot /boot/kernel.elf precision=32 model=microv1
    module /boot/microv1-f32.bm microv1
    boot
}

menuentry "BananaMind 2 Mini - 2-bit (12 MB)" {
    multiboot /boot/kernel.elf precision=2 model=mini
    module /boot/mini-q2.bm mini
    boot
}

menuentry "BananaMind 2 Mini - 4-bit (20 MB, GOOD PCs)" {
    multiboot /boot/kernel.elf precision=4 model=mini
    module /boot/mini-q4.bm mini
    boot
}
