UI menu.c32
DEFAULT hq
ONTIMEOUT hq
PROMPT 0
TIMEOUT 40

MENU TITLE BananaMindOS - DOSBox-X
MENU AUTOBOOT Starting BananaMindOS in # second{,s}...
MENU TABMSG Use arrows and Enter

LABEL hq
    MENU LABEL High Quality mode (486+)
    KERNEL mboot.c32
    APPEND /boot/kernel.elf ui=hq models=iso

LABEL graphical
    MENU LABEL Graphical model library (Pentium+)
    KERNEL mboot.c32
    APPEND /boot/kernel.elf ui=graphical models=iso

LABEL compatibility
    MENU LABEL 486 compatibility mode
    KERNEL mboot.c32
    APPEND /boot/kernel-486.elf ui=compat models=iso cpu=486
